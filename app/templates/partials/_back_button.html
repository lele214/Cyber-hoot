{% macro back_button(url, text) %}
<a href="{{ url }}"
    class="fixed top-5 left-5 px-6 py-3 bg-cyber-bg border-2 border-cyber-accent text-cyber-text-lighter rounded-lg font-semibold text-sm transition-all duration-300 hover:bg-cyber-border hover:border-cyber-accent-light hover:shadow-glow-sm hover:-translate-x-1 z-50">
    ← {{ text }}
</a>
{% endmacro %}
