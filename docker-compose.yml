services:

  db:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
      # ici est l'initialisation de la base de donnée au démarrage du docker
      # permet de récupérer également les infos "données de test" dans le dossier test
      - ./database/db_schemaV3-3.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./test/seed_data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app/app
      - ./database:/app/database
      - ./run.py:/app/run.py
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: [ "python3", "run.py" ]

volumes:
  db_data:
