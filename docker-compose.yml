services:
  db:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      # Variables non sensibles lues depuis le .env via interpolation
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      # Le suffixe _FILE indique à MySQL de lire le mot de passe depuis un fichier secret
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
      # ici est l'initialisation de la base de donnée au démarrage du docker
      # permet de récupérer également les infos "données de test" dans le dossier test
      - ./database/db_schemaV3-3.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./test/seed_data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app/app
      - ./database:/app/database
      - ./run.py:/app/run.py
      - ./uploads:/app/uploads
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run build:css && python3 run.py"
    networks:
      - frontend
      - backend

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8181:8080"
    depends_on:
      - db
    networks:
      - frontend
      - backend

# Volume créé avec les paramètres par défaut
# Persistance des données de la DB ici
volumes:
  db_data: # driver: local

# Réseaux isolés : frontend (accès externe) / backend (communication interne)
networks:
  frontend:
  backend:

# Secrets Docker : montés en fichiers dans /run/secrets/ (lecture seule)
secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
